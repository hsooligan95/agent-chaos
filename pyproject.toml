[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchaos"
version = "0.1.0"
description = "Chaos engineering for AI agents: inject failure modes, measure silent failures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew Hsu" }]
keywords = ["ai-agents", "chaos-engineering", "fault-injection", "reliability", "llm"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agentchaos = "agentchaos.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
